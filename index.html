<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #09070f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      color: #bd75ff;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .box {
      background: #110d19;
      border: 1px solid #54277d;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(123, 44, 255, 0.12);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #21152e;
      color: #aaa;
      cursor: pointer;
      font-weight: bold;
    }

    .tab.active {
      background: #7b2cff;
      color: white;
    }

    h2 {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      background: #0a0810;
      border: 1px solid #38224d;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #9b4cff;
    }

    .main-btn {
      width: 100%;
      padding: 13px;
      background: #7b2cff;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #994fff;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 11px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #2b1116;
      border: 1px solid #6b2731;
      color: #ff7c88;
    }

    .message.success {
      display: block;
      background: #102a18;
      border: 1px solid #245c35;
      color: #72e59a;
    }

    .pending {
      text-align: center;
      color: #888;
      line-height: 1.5;
      margin-top: 15px;
      font-size: 12px;
    }

    #registerForm {
      display: none;
    }

    .small {
      color: #666;
      font-size: 11px;
      text-align: center;
      margin-top: 18px;
      line-height: 1.5;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      NØV3X COMS
    </div>

    <div class="subtitle">
      PRIVATE CLAN COMMAND CENTER
    </div>


    <div class="box">

      <!-- TABS -->

      <div class="tabs">

        <button
          id="loginTab"
          class="tab active"
          onclick="showLogin()"
        >
          LOGIN
        </button>

        <button
          id="registerTab"
          class="tab"
          onclick="showRegister()"
        >
          REGISTER
        </button>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- LOGIN -->

      <div id="loginForm">

        <h2>Welcome Back</h2>

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          id="loginButton"
          class="main-btn"
          onclick="login()"
        >
          LOGIN
        </button>

      </div>


      <!-- REGISTER -->

      <div id="registerForm">

        <h2>Join NØV3X</h2>

        <input
          type="text"
          id="registerUsername"
          placeholder="Username"
          maxlength="30"
          autocomplete="nickname"
        >

        <input
          type="email"
          id="registerEmail"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          autocomplete="new-password"
        >

        <input
          type="password"
          id="registerConfirm"
          placeholder="Confirm password"
          autocomplete="new-password"
        >

        <button
          id="registerButton"
          class="main-btn"
          onclick="register()"
        >
          REQUEST MEMBERSHIP
        </button>

        <div class="pending">
          New accounts require NØV3X admin approval
          before they can enter the private clan.
        </div>

      </div>


      <div class="small">
        NØV3X COMS • PRIVATE CLAN SYSTEM
      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>


  <script>

    /* =========================
       SWITCH LOGIN / REGISTER
    ========================= */

    function showLogin() {

      document.getElementById("loginForm")
        .style.display = "block";

      document.getElementById("registerForm")
        .style.display = "none";

      document.getElementById("loginTab")
        .classList.add("active");

      document.getElementById("registerTab")
        .classList.remove("active");

      clearMessage();
    }


    function showRegister() {

      document.getElementById("loginForm")
        .style.display = "none";

      document.getElementById("registerForm")
        .style.display = "block";

      document.getElementById("loginTab")
        .classList.remove("active");

      document.getElementById("registerTab")
        .classList.add("active");

      clearMessage();
    }


    /* =========================
       MESSAGES
    ========================= */

    function showMessage(text, type) {

      const box =
        document.getElementById("message");

      box.textContent = text;

      box.className =
        "message " + type;

    }


    function clearMessage() {

      const box =
        document.getElementById("message");

      box.textContent = "";

      box.className = "message";

    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document.getElementById("loginEmail")
          .value
          .trim();

      const password =
        document.getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage(
          "Enter your email and password.",
          "error"
        );

        return;
      }


      button.classList.add("loading");
      button.textContent = "LOGGING IN...";


      try {

        const result =
          await auth.signInWithEmailAndPassword(
            email,
            password
          );


        const userDoc =
          await db
            .collection("users")
            .doc(result.user.uid)
            .get();


        if (!userDoc.exists) {

          await auth.signOut();

          showMessage(
            "Your account profile was not found.",
            "error"
          );

          button.classList.remove("loading");
          button.textContent = "LOGIN";

          return;
        }


        const data =
          userDoc.data();


        /* APPROVED ACCOUNT */

        if (data.approved === true) {

          window.location.href =
            "home.html";

          return;
        }


        /* NOT APPROVED */

        await auth.signOut();

        window.location.href =
          "pending.html";

      }

      catch (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          getFirebaseError(error),
          "error"
        );

        button.classList.remove("loading");
        button.textContent = "LOGIN";

      }

    }


    /* =========================
       REGISTER
    ========================= */

    async function register() {

      const username =
        document.getElementById("registerUsername")
          .value
          .trim();

      const email =
        document.getElementById("registerEmail")
          .value
          .trim();

      const password =
        document.getElementById("registerPassword")
          .value;

      const confirm =
        document.getElementById("registerConfirm")
          .value;

      const button =
        document.getElementById("registerButton");


      /* VALIDATION */

      if (
        !username ||
        !email ||
        !password ||
        !confirm
      ) {

        showMessage(
          "Complete all fields.",
          "error"
        );

        return;
      }


      if (username.length < 3) {

        showMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      button.classList.add("loading");
      button.textContent = "SUBMITTING...";


      try {

        /*
          Create Firebase Authentication account.
        */

        const result =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );


        /*
          IMPORTANT SECURITY SETUP

          New accounts ALWAYS start as:

          role     = member
          approved = false

          The person registering cannot
          choose their own admin role.
        */

        await db
          .collection("users")
          .doc(result.user.uid)
          .set({

            username: username,

            email: email,

            role: "member",

            approved: false,

            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()

          });


        /*
          Sign them out immediately.
        */

        await auth.signOut();


        /*
          Send them to the waiting page.
        */

        window.location.href =
          "pending.html";

      }

      catch (error) {

        console.error(
          "Registration error:",
          error
        );

        showMessage(
          getFirebaseError(error),
          "error"
        );

        button.classList.remove("loading");
        button.textContent =
          "REQUEST MEMBERSHIP";

      }

    }


    /* =========================
       FIREBASE ERROR MESSAGES
    ========================= */

    function getFirebaseError(error) {

      switch (error.code) {

        case "auth/email-already-in-use":
          return "That email is already registered.";

        case "auth/invalid-email":
          return "Enter a valid email address.";

        case "auth/weak-password":
          return "Password must be at least 6 characters.";

        case "auth/invalid-credential":
          return "Incorrect email or password.";

        case "auth/network-request-failed":
          return "Network error. Check your connection.";

        case "permission-denied":
          return "Firebase permission denied.";

        default:
          return error.message ||
            "Something went wrong.";

      }

    }

  </script>

</body>
</html>
