<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS - Leaderboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
</head>

<body>

  <div class="container">

    <div class="topbar">
      <div>
        <h1>🏆 NØV3X LEADERBOARD</h1>
        <p>Clan Ranking & Points</p>
      </div>

      <button onclick="goHome()">🏠 Dashboard</button>
    </div>


    <!-- ADMIN ADD SCORE -->
    <div id="adminPanel" class="admin-panel" style="display:none;">

      <h2>👑 ADMIN — ADD TEAM SCORE</h2>

      <input
        type="text"
        id="teamName"
        placeholder="Team / Player Name"
      >

      <input
        type="number"
        id="teamPoints"
        placeholder="Points"
        min="0"
      >

      <button onclick="addScore()">➕ ADD SCORE</button>

    </div>


    <!-- TOP 3 -->
    <div class="top-three">

      <div class="top-card second">
        <div class="rank">🥈</div>
        <h2 id="top2Name">---</h2>
        <p id="top2Points">0 PTS</p>
      </div>

      <div class="top-card first">
        <div class="rank">🥇</div>
        <h2 id="top1Name">---</h2>
        <p id="top1Points">0 PTS</p>
      </div>

      <div class="top-card third">
        <div class="rank">🥉</div>
        <h2 id="top3Name">---</h2>
        <p id="top3Points">0 PTS</p>
      </div>

    </div>


    <!-- FULL LEADERBOARD -->
    <div class="leaderboard">

      <h2>🔥 CLAN RANKINGS</h2>

      <div id="leaderboardList">
        <p class="loading">Loading leaderboard...</p>
      </div>

    </div>

  </div>


<script>

let currentUser = null;
let currentUserData = null;


// =========================
// AUTH CHECK
// =========================

auth.onAuthStateChanged(async function(user) {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  try {

    const doc = await db
      .collection("users")
      .doc(user.uid)
      .get();

    if (!doc.exists) {
      window.location.href = "index.html";
      return;
    }

    currentUserData = doc.data();

    if (currentUserData.approved !== true) {
      window.location.href = "pending.html";
      return;
    }

    // Show admin controls
    if (currentUserData.role === "admin") {
      document.getElementById("adminPanel").style.display = "block";
    }

    loadLeaderboard();

  } catch (error) {

    console.error(error);
    alert("Error loading account.");

  }

});


// =========================
// LOAD LEADERBOARD
// =========================

function loadLeaderboard() {

  db.collection("leaderboard")
    .orderBy("points", "desc")
    .onSnapshot(function(snapshot) {

      const list = document.getElementById("leaderboardList");

      list.innerHTML = "";

      let teams = [];

      snapshot.forEach(function(doc) {

        const data = doc.data();

        teams.push({
          id: doc.id,
          team: data.team || "Unknown",
          points: Number(data.points) || 0
        });

      });


      // TOP 1
      if (teams[0]) {
        document.getElementById("top1Name").textContent = teams[0].team;
        document.getElementById("top1Points").textContent =
          teams[0].points + " PTS";
      } else {
        document.getElementById("top1Name").textContent = "---";
        document.getElementById("top1Points").textContent = "0 PTS";
      }


      // TOP 2
      if (teams[1]) {
        document.getElementById("top2Name").textContent = teams[1].team;
        document.getElementById("top2Points").textContent =
          teams[1].points + " PTS";
      } else {
        document.getElementById("top2Name").textContent = "---";
        document.getElementById("top2Points").textContent = "0 PTS";
      }


      // TOP 3
      if (teams[2]) {
        document.getElementById("top3Name").textContent = teams[2].team;
        document.getElementById("top3Points").textContent =
          teams[2].points + " PTS";
      } else {
        document.getElementById("top3Name").textContent = "---";
        document.getElementById("top3Points").textContent = "0 PTS";
      }


      // FULL LIST

      if (teams.length === 0) {

        list.innerHTML = `
          <div class="empty">
            🏆 No leaderboard entries yet.
          </div>
        `;

        return;
      }


      teams.forEach(function(team, index) {

        const rank = index + 1;

        let medal = "";

        if (rank === 1) medal = "🥇";
        else if (rank === 2) medal = "🥈";
        else if (rank === 3) medal = "🥉";
        else medal = "#" + rank;


        const row = document.createElement("div");

        row.className = "leader-row";


        let deleteButton = "";

        if (
          currentUserData &&
          currentUserData.role === "admin"
        ) {

          deleteButton = `
            <button
              class="delete-btn"
              onclick="deleteScore('${team.id}')"
            >
              🗑️
            </button>
          `;

        }


        row.innerHTML = `

          <div class="rank-box">
            ${medal}
          </div>

          <div class="team-info">
            <strong>${escapeHTML(team.team)}</strong>
            <span>Clan Ranking</span>
          </div>

          <div class="points">
            ${team.points}
            <small>PTS</small>
          </div>

          ${deleteButton}

        `;


        list.appendChild(row);

      });

    }, function(error) {

      console.error(error);

      document.getElementById("leaderboardList").innerHTML = `
        <div class="empty">
          ⚠️ Unable to load leaderboard.
        </div>
      `;

    });

}


// =========================
// ADD SCORE
// =========================

async function addScore() {

  if (!currentUserData || currentUserData.role !== "admin") {
    alert("Admin access required.");
    return;
  }


  const team = document
    .getElementById("teamName")
    .value
    .trim();

  const points = Number(
    document.getElementById("teamPoints").value
  );


  if (!team) {
    alert("Enter a team name.");
    return;
  }


  if (isNaN(points) || points < 0) {
    alert("Enter valid points.");
    return;
  }


  try {

    await db.collection("leaderboard").add({

      team: team,

      points: points,

      createdBy: currentUser.uid,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


    document.getElementById("teamName").value = "";
    document.getElementById("teamPoints").value = "";

    alert("Score added!");

  } catch (error) {

    console.error(error);
    alert("Could not add score.");

  }

}


// =========================
// DELETE SCORE
// =========================

async function deleteScore(id) {

  if (!currentUserData || currentUserData.role !== "admin") {
    alert("Admin access required.");
    return;
  }


  if (!confirm("Delete this leaderboard entry?")) {
    return;
  }


  try {

    await db
      .collection("leaderboard")
      .doc(id)
      .delete();

  } catch (error) {

    console.error(error);
    alert("Could not delete entry.");

  }

}


// =========================
// ESCAPE HTML
// =========================

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// =========================
// NAVIGATION
// =========================

function goHome() {

  window.location.href = "home.html";

}

</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #3b126b, #08030f 55%);
  color: white;
  min-height: 100vh;
}

.container {
  width: 95%;
  max-width: 1100px;
  margin: auto;
  padding: 25px 0 50px;
}


/* TOPBAR */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}

.topbar h1 {
  margin: 0;
  color: #d9a7ff;
  font-size: 28px;
}

.topbar p {
  margin: 5px 0;
  color: #aaa;
}

.topbar button {
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  background: #7b2cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}


/* ADMIN */

.admin-panel {
  background: rgba(30, 10, 50, 0.9);
  border: 1px solid #7430b8;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 0 25px rgba(130, 40, 255, 0.2);
}

.admin-panel h2 {
  margin-top: 0;
  color: #d8a3ff;
}

.admin-panel input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #63349a;
  border-radius: 9px;
  background: #12091c;
  color: white;
  outline: none;
}

.admin-panel button {
  margin-top: 8px;
  padding: 12px 18px;
  border: none;
  border-radius: 9px;
  background: #8b36ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}


/* TOP THREE */

.top-three {
  display: grid;
  grid-template-columns: 1fr 1.15fr 1fr;
  gap: 15px;
  align-items: end;
  margin-bottom: 30px;
}

.top-card {
  text-align: center;
  padding: 25px 15px;
  border-radius: 18px;
  background: rgba(30, 12, 50, 0.9);
  border: 1px solid #6c2ca3;
}

.top-card.first {
  padding-top: 35px;
  padding-bottom: 35px;
  border: 2px solid #b15cff;
  box-shadow: 0 0 30px rgba(170, 70, 255, 0.35);
}

.rank {
  font-size: 38px;
}

.top-card h2 {
  margin: 12px 0 5px;
  word-break: break-word;
}

.top-card p {
  margin: 0;
  color: #d9a7ff;
  font-weight: bold;
}


/* LEADERBOARD */

.leaderboard {
  background: rgba(18, 7, 28, 0.95);
  border: 1px solid #51257b;
  border-radius: 18px;
  padding: 20px;
}

.leaderboard > h2 {
  margin-top: 0;
  color: #d8a3ff;
}


.leader-row {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  margin: 10px 0;
  border-radius: 12px;
  background: rgba(50, 20, 75, 0.65);
  border: 1px solid #43205e;
}


.rank-box {
  width: 55px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}


.team-info {
  flex: 1;
}

.team-info strong {
  display: block;
  font-size: 17px;
}

.team-info span {
  display: block;
  margin-top: 3px;
  font-size: 12px;
  color: #9c8ca8;
}


.points {
  min-width: 80px;
  text-align: right;
  color: #d69cff;
  font-size: 20px;
  font-weight: bold;
}

.points small {
  font-size: 11px;
}


.delete-btn {
  border: none;
  background: #5b183f;
  color: white;
  padding: 9px;
  border-radius: 8px;
  cursor: pointer;
}


.loading,
.empty {
  text-align: center;
  color: #aaa;
  padding: 25px;
}


/* MOBILE */

@media (max-width: 650px) {

  .topbar {
    flex-direction: column;
    align-items: stretch;
  }

  .topbar button {
    width: 100%;
  }

  .top-three {
    grid-template-columns: 1fr;
  }

  .top-card.first {
    order: -1;
  }

  .leader-row {
    gap: 8px;
  }

  .rank-box {
    width: 35px;
  }

  .points {
    min-width: 65px;
  }

}

</style>

</body>
  </html>
