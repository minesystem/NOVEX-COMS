<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS - Scrimmage</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08030f;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 65px;
      background: #12051f;
      border-bottom: 1px solid #7b2cff;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;
    }

    .logo {
      color: #b76cff;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      background: #24103b;
      border: 1px solid #7b2cff;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      color: #c88aff;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .event {
      background: #11071c;
      border: 1px solid #29133d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .event h2 {
      color: #b76cff;
      margin-bottom: 15px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .info-box {
      background: #0d0615;
      border: 1px solid #241333;
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      color: #777;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .value {
      color: white;
      font-weight: bold;
    }

    .slots-title {
      margin: 20px 0 12px;
      color: #c88aff;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .slot {
      background: #0d0615;
      border: 1px solid #29133d;
      border-radius: 8px;
      padding: 12px;
    }

    .slot-number {
      color: #b76cff;
      font-weight: bold;
    }

    .open {
      color: #55e88a;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .info,
      .slots {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    NØV3X COMS
  </div>

  <button class="back" onclick="goHome()">
    ← Dashboard
  </button>

</header>


<main>

  <h1>🎮 Scrimmage</h1>

  <p class="subtitle">
    NØV3X CODM Scrimmage Management
  </p>


  <div class="event">

    <h2>
      NØV3X CORE SCRIMMAGE
    </h2>


    <div class="info">

      <div class="info-box">
        <div class="label">DATE</div>
        <div class="value" id="eventDate">
          Not Set
        </div>
      </div>

      <div class="info-box">
        <div class="label">TIME</div>
        <div class="value" id="eventTime">
          Not Set
        </div>
      </div>

      <div class="info-box">
        <div class="label">MAPS</div>
        <div class="value">
          ISO - BO - ISO
        </div>
      </div>

      <div class="info-box">
        <div class="label">STATUS</div>
        <div class="value" style="color:#55e88a;">
          ● OPEN
        </div>
      </div>

    </div>


    <h3 class="slots-title">
      TRYOUT / SCRIMMAGE SLOTS
    </h3>


    <div class="slots" id="slots">

      <!-- Slots generated by JavaScript -->

    </div>

  </div>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

auth.onAuthStateChanged(function(user) {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  createSlots();

});


function createSlots() {

  const container =
    document.getElementById("slots");

  container.innerHTML = "";


  for (let i = 1; i <= 25; i++) {

    const slot =
      document.createElement("div");

    slot.className = "slot";


    slot.innerHTML = `
      <div class="slot-number">
        SLOT ${i}
      </div>

      <div class="open">
        OPEN
      </div>
    `;


    container.appendChild(slot);

  }

}


function goHome() {

  window.location.href =
    "home.html";

}

</script>

</body>
</html>
