<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X Scrimmage</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #09070f;
      color: white;
      min-height: 100vh;
    }

    .topbar {
      height: 65px;
      background: #110d1d;
      border-bottom: 1px solid #7b2cff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      color: #bd75ff;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button {
      cursor: pointer;
    }

    .back {
      background: #251536;
      color: white;
      border: 1px solid #7130a8;
      padding: 9px 14px;
      border-radius: 8px;
    }

    .main {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .header {
      background: linear-gradient(135deg, #160d24, #28103e);
      border: 1px solid #722fc2;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #c37cff;
      margin-bottom: 8px;
    }

    .header p {
      color: #999;
    }

    .admin-panel {
      display: none;
      background: #110d19;
      border: 1px solid #7130a8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .admin-panel h2 {
      color: #d09aff;
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      background: #09070f;
      border: 1px solid #38224d;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #9b4cff;
    }

    .create-btn {
      background: #7b2cff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .create-btn:hover {
      background: #994fff;
    }

    .scrim {
      background: #110d19;
      border: 1px solid #2b193d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .scrim-title {
      color: #d09aff;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .scrim-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
    }

    .info {
      background: #0c0911;
      border: 1px solid #25172f;
      border-radius: 8px;
      padding: 12px;
    }

    .label {
      color: #777;
      font-size: 10px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .value {
      color: white;
      font-weight: bold;
    }

    .description {
      color: #bbb;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 15px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #102a18;
      border: 1px solid #245c35;
      color: #72e59a;
      font-size: 11px;
      font-weight: bold;
    }

    .delete-btn {
      margin-top: 15px;
      background: #2b1116;
      color: #ff7c88;
      border: 1px solid #6b2731;
      padding: 8px 12px;
      border-radius: 7px;
      display: none;
    }

    .empty,
    .loading,
    .error {
      background: #110d19;
      border: 1px solid #2b193d;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #ff7c88;
    }

    @media (max-width: 700px) {
      .scrim-info {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">

    <div class="logo">
      NØV3X COMS
    </div>

    <button class="back" onclick="goHome()">
      ← DASHBOARD
    </button>

  </div>


  <main class="main">

    <div class="header">

      <h1>🎮 NØV3X SCRIMMAGE</h1>

      <p>
        Clan scrimmage events and match information.
      </p>

    </div>


    <!-- ADMIN ONLY -->

    <div
      id="adminPanel"
      class="admin-panel"
    >

      <h2>👑 CREATE SCRIMMAGE</h2>

      <div class="form">

        <input
          id="title"
          type="text"
          placeholder="Scrimmage title"
          maxlength="60"
        >

        <input
          id="date"
          type="date"
        >

        <input
          id="time"
          type="time"
        >

        <input
          id="maps"
          type="text"
          placeholder="Maps — example: ISO - BO - ISO"
          maxlength="50"
        >

        <textarea
          id="description"
          placeholder="Scrimmage rules / notes"
          maxlength="500"
        ></textarea>

        <button
          class="create-btn"
          onclick="createScrimmage()"
        >
          + CREATE SCRIMMAGE
        </button>

      </div>

    </div>


    <!-- SCRIMMAGES -->

    <div id="scrimmages">

      <div class="loading">
        Loading scrimmages...
      </div>

    </div>

  </main>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>


  <script>

    let currentUser = null;
    let currentRole = "member";


    // =========================
    // AUTH CHECK
    // =========================

    auth.onAuthStateChanged(async function(user) {

      if (!user) {

        window.location.href = "index.html";

        return;
      }


      currentUser = user;


      try {

        const userDoc =
          await db.collection("users")
            .doc(user.uid)
            .get();


        if (!userDoc.exists) {

          await auth.signOut();

          window.location.href = "index.html";

          return;
        }


        const data =
          userDoc.data();


        if (data.approved !== true) {

          window.location.href = "pending.html";

          return;
        }


        currentRole =
          data.role || "member";


        if (currentRole === "admin") {

          document.getElementById(
            "adminPanel"
          ).style.display = "block";

        }


        loadScrimmages();


      } catch (error) {

        console.error(
          "Access error:",
          error
        );

      }

    });


    // =========================
    // LOAD SCRIMMAGES
    // =========================

    function loadScrimmages() {

      db.collection("scrimmages")
        .orderBy("createdAt", "desc")
        .onSnapshot(

          function(snapshot) {

            const container =
              document.getElementById(
                "scrimmages"
              );


            container.innerHTML = "";


            if (snapshot.empty) {

              container.innerHTML = `

                <div class="empty">

                  🎮<br><br>

                  No clan scrimmages scheduled.

                </div>

              `;

              return;
            }


            snapshot.forEach(function(doc) {

              const data =
                doc.data();


              const card =
                document.createElement(
                  "div"
                );


              card.className =
                "scrim";


              const title =
                escapeHTML(
                  data.title ||
                  "NØV3X Scrimmage"
                );


              const maps =
                escapeHTML(
                  data.maps ||
                  "Not specified"
                );


              const description =
                escapeHTML(
                  data.description ||
                  "No additional information."
                );


              let date =
                "Date not set";


              if (data.date) {

                date =
                  data.date;

              }


              let time =
                "Time not set";


              if (data.time) {

                time =
                  data.time;

              }


              card.innerHTML = `

                <div class="scrim-title">

                  🎮 ${title}

                </div>


                <div class="scrim-info">

                  <div class="info">

                    <div class="label">
                      DATE
                    </div>

                    <div class="value">
                      ${date}
                    </div>

                  </div>


                  <div class="info">

                    <div class="label">
                      TIME
                    </div>

                    <div class="value">
                      ${time}
                    </div>

                  </div>


                  <div class="info">

                    <div class="label">
                      MAPS
                    </div>

                    <div class="value">
                      ${maps}
                    </div>

                  </div>

                </div>


                <div class="description">

                  ${description}

                </div>


                <div class="status">
                  ● CLAN SCRIMMAGE
                </div>


                ${
                  currentRole === "admin"
                  ? `

                    <br>

                    <button
                      class="delete-btn"
                      style="display:inline-block"
                      onclick="deleteScrimmage('${doc.id}')"
                    >
                      DELETE SCRIMMAGE
                    </button>

                  `
                  : ""
                }

              `;


              container.appendChild(card);

            });

          },


          function(error) {

            console.error(
              "Scrimmage error:",
              error
            );


            document.getElementById(
              "scrimmages"
            ).innerHTML = `

              <div class="error">

                Unable to load scrimmages.

                <br><br>

                Check your Firestore rules.

              </div>

            `;

          }

        );

    }


    // =========================
    // CREATE SCRIMMAGE
    // =========================

    async function createScrimmage() {

      if (currentRole !== "admin") {

        return;

      }


      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const date =
        document.getElementById(
          "date"
        ).value;


      const time =
        document.getElementById(
          "time"
        ).value;


      const maps =
        document.getElementById(
          "maps"
        ).value.trim();


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      if (!title || !date || !time) {

        alert(
          "Enter the scrimmage title, date, and time."
        );

        return;

      }


      try {

        await db.collection(
          "scrimmages"
        ).add({

          title: title,

          date: date,

          time: time,

          maps: maps,

          description: description,

          createdBy:
            currentUser.uid,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


        document.getElementById(
          "title"
        ).value = "";


        document.getElementById(
          "date"
        ).value = "";


        document.getElementById(
          "time"
        ).value = "";


        document.getElementById(
          "maps"
        ).value = "";


        document.getElementById(
          "description"
        ).value = "";


      } catch (error) {

        console.error(error);

        alert(
          "Unable to create scrimmage."
        );

      }

    }


    // =========================
    // DELETE SCRIMMAGE
    // =========================

    async function deleteScrimmage(id) {

      if (currentRole !== "admin") {

        return;

      }


      if (
        !confirm(
          "Delete this scrimmage?"
        )
      ) {

        return;

      }


      try {

        await db.collection(
          "scrimmages"
        )
        .doc(id)
        .delete();


      } catch (error) {

        console.error(error);

        alert(
          "Unable to delete scrimmage."
        );

      }

    }


    // =========================
    // SECURITY
    // =========================

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }


    // =========================
    // DASHBOARD
    // =========================

    function goHome() {

      window.location.href =
        "home.html";

    }

  </script>

</body>
</html>
