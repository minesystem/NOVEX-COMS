<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS - Live Voice</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
</head>

<body>

<div class="app">

  <header>

    <div>
      <h1>🔊 NØV3X VOICE</h1>
      <p>Live Private Clan Voice</p>
    </div>

    <button onclick="goHome()">🏠 Dashboard</button>

  </header>


  <main>

    <section class="voice-panel">

      <div class="status">

        <span id="statusDot"></span>

        <span id="statusText">
          Disconnected
        </span>

      </div>


      <div id="micIcon" class="mic">
        🎙️
      </div>


      <h2>NØV3X LIVE VOICE</h2>

      <p id="message">
        Join the room to talk with clan members.
      </p>


      <div class="buttons">

        <button
          id="joinBtn"
          class="join"
          onclick="joinVoice()"
        >
          🎙️ JOIN VOICE
        </button>


        <button
          id="muteBtn"
          class="control"
          onclick="toggleMute()"
          disabled
        >
          🔇 MUTE
        </button>


        <button
          id="leaveBtn"
          class="leave"
          onclick="leaveVoice()"
          disabled
        >
          📞 LEAVE
        </button>

      </div>

    </section>


    <section class="members">

      <h2>👥 VOICE MEMBERS</h2>

      <div id="memberList">

        <div class="empty">
          Nobody is connected.
        </div>

      </div>

    </section>


    <section class="audio-section">

      <h2>🔊 CONNECTED AUDIO</h2>

      <div id="audioContainer"></div>

    </section>

  </main>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let currentUserData = null;

let localStream = null;

let joined = false;
let muted = false;

let peers = {};

let memberUnsubscribe = null;


/*
   STUN server.

   This helps devices discover a route
   to each other.
*/

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================================
   AUTH
========================================= */

auth.onAuthStateChanged(async function(user) {

  if (!user) {

    window.location.href = "index.html";

    return;

  }


  currentUser = user;


  try {

    const userDoc = await db
      .collection("users")
      .doc(user.uid)
      .get();


    if (!userDoc.exists) {

      window.location.href = "index.html";

      return;

    }


    currentUserData = userDoc.data();


    if (currentUserData.approved !== true) {

      window.location.href = "pending.html";

      return;

    }


    listenForVoiceMembers();


  } catch (error) {

    console.error(error);

    showMessage(
      "Unable to load your account."
    );

  }

});


/* =========================================
   JOIN
========================================= */

async function joinVoice() {

  if (joined) return;


  try {

    showMessage(
      "Requesting microphone permission..."
    );


    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true

        },

        video: false

      });


    joined = true;
    muted = false;


    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .set({

        uid: currentUser.uid,

        username:
          currentUserData.username || "Member",

        muted: false,

        joinedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    updateUI();


    showMessage(
      "Connected. Waiting for clan members..."
    );


    /*
      Start watching for other members.
    */

    listenForPeers();


  } catch (error) {

    console.error(error);


    if (
      error.name === "NotAllowedError"
    ) {

      showMessage(
        "Microphone permission was denied."
      );

    } else {

      showMessage(
        "Could not access your microphone."
      );

    }

  }

}


/* =========================================
   LISTEN FOR MEMBERS
========================================= */

function listenForVoiceMembers() {

  memberUnsubscribe =
    db.collection("voiceRoom")
      .orderBy("joinedAt", "asc")
      .onSnapshot(function(snapshot) {

        const list =
          document.getElementById(
            "memberList"
          );


        list.innerHTML = "";


        if (snapshot.empty) {

          list.innerHTML = `
            <div class="empty">
              Nobody is connected.
            </div>
          `;

          return;

        }


        snapshot.forEach(function(doc) {

          const data = doc.data();


          const item =
            document.createElement("div");


          item.className =
            "member";


          const icon =
            data.muted
              ? "🔇"
              : "🎙️";


          const you =
            data.uid === currentUser.uid
              ? " YOU"
              : "";


          item.innerHTML = `

            <div class="member-avatar">
              🎮
            </div>

            <div class="member-info">

              <strong>
                ${escapeHTML(
                  data.username || "Member"
                )}
              </strong>

              <span>
                ${data.uid === currentUser.uid
                  ? "You"
                  : "NØV3X Member"}
              </span>

            </div>

            <div class="member-mic">
              ${icon}${you}
            </div>

          `;


          list.appendChild(item);

        });

      });

}


/* =========================================
   WATCH PEERS
========================================= */

function listenForPeers() {

  db.collection("voiceRoom")
    .onSnapshot(async function(snapshot) {

      if (!joined) return;


      const activeIds = [];


      snapshot.forEach(function(doc) {

        const id = doc.id;


        if (
          id !== currentUser.uid
        ) {

          activeIds.push(id);

        }

      });


      /*
        Remove peers that left.
      */

      for (
        const peerId in peers
      ) {

        if (
          !activeIds.includes(peerId)
        ) {

          closePeer(peerId);

        }

      }


      /*
        Create connections.

        UID comparison determines which
        device creates the offer.
      */

      for (
        const peerId of activeIds
      ) {

        if (!peers[peerId]) {

          if (
            currentUser.uid < peerId
          ) {

            await createOffer(peerId);

          }

        }

      }

    });

}


/* =========================================
   CREATE OFFER
========================================= */

async function createOffer(
  peerId
) {

  if (peers[peerId]) return;


  const pc =
    createPeerConnection(
      peerId
    );


  peers[peerId] = {

    pc: pc,

    offerCreated: true

  };


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await db
    .collection("voiceSignals")
    .doc(peerId)
    .collection("offers")
    .doc(currentUser.uid)
    .set({

      type: offer.type,

      sdp: offer.sdp,

      from: currentUser.uid,

      fromName:
        currentUserData.username || "Member",

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


  listenForAnswer(peerId);

}


/* =========================================
   LISTEN FOR ANSWER
========================================= */

function listenForAnswer(
  peerId
) {

  db.collection("voiceSignals")
    .doc(currentUser.uid)
    .collection("answers")
    .doc(peerId)
    .onSnapshot(async function(doc) {

      if (!doc.exists) return;

      const data = doc.data();


      const peer =
        peers[peerId];


      if (!peer) return;


      if (
        peer.pc.currentRemoteDescription
      ) return;


      try {

        await peer.pc.setRemoteDescription({

          type: data.type,

          sdp: data.sdp

        });

      } catch (error) {

        console.error(
          "Answer error:",
          error
        );

      }

    });

}


/* =========================================
   CHECK OFFERS
========================================= */

db.collection("voiceSignals")
  .doc(
    "__listener__"
  );


function startOfferListener() {

  if (!currentUser) return;


  return db.collection("voiceSignals")
    .doc(currentUser.uid)
    .collection("offers")
    .onSnapshot(async function(snapshot) {

      for (
        const change of snapshot.docChanges()
      ) {

        if (
          change.type !== "added"
        ) continue;


        const offerData =
          change.doc.data();


        const peerId =
          offerData.from;


        if (
          peers[peerId]
        ) continue;


        await acceptOffer(
          peerId,
          offerData
        );

      }

    });

}


let offerUnsubscribe = null;


function beginOfferListener() {

  if (offerUnsubscribe) return;

  offerUnsubscribe =
    startOfferListener();

}


/* =========================================
   ACCEPT OFFER
========================================= */

async function acceptOffer(
  peerId,
  offerData
) {

  const pc =
    createPeerConnection(
      peerId
    );


  peers[peerId] = {

    pc: pc,

    offerReceived: true

  };


  try {

    await pc.setRemoteDescription({

      type: offerData.type,

      sdp: offerData.sdp

    });


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    await db
      .collection("voiceSignals")
      .doc(peerId)
      .collection("answers")
      .doc(currentUser.uid)
      .set({

        type: answer.type,

        sdp: answer.sdp,

        from: currentUser.uid,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================================
   PEER CONNECTION
========================================= */

function createPeerConnection(
  peerId
) {

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  /*
    Send microphone.
  */

  if (localStream) {

    localStream
      .getTracks()
      .forEach(function(track) {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  /*
    Receive microphone.
  */

  pc.ontrack = function(event) {

    const stream =
      event.streams[0];


    addRemoteAudio(
      peerId,
      stream
    );

  };


  /*
    ICE candidates.

    Store candidates under the
    other user's document.
  */

  pc.onicecandidate =
    async function(event) {

      if (!event.candidate) return;


      try {

        await db
          .collection("voiceSignals")
          .doc(peerId)
          .collection("candidates")
          .doc(
            currentUser.uid
            + "_"
            + Date.now()
            + "_"
            + Math.random()
              .toString(36)
              .substring(2, 8)
          )
          .set({

            from:
              currentUser.uid,

            candidate:
              event.candidate.toJSON(),

            createdAt:
              firebase.firestore.FieldValue
                .serverTimestamp()

          });

      } catch (error) {

        console.error(
          "ICE error:",
          error
        );

      }

    };


  /*
    Connection state.
  */

  pc.onconnectionstatechange =
    function() {

      console.log(
        "Peer:",
        peerId,
        pc.connectionState
      );

      if (
        pc.connectionState ===
        "failed"
      ) {

        pc.restartIce();

      }

    };


  listenForCandidates(
    peerId,
    pc
  );


  return pc;

}


/* =========================================
   ICE CANDIDATES
========================================= */

function listenForCandidates(
  peerId,
  pc
) {

  db.collection("voiceSignals")
    .doc(currentUser.uid)
    .collection("candidates")
    .where(
      "from",
      "==",
      peerId
    )
    .onSnapshot(async function(snapshot) {

      for (
        const change of snapshot.docChanges()
      ) {

        if (
          change.type !== "added"
        ) continue;


        const data =
          change.doc.data();


        try {

          await pc.addIceCandidate(

            new RTCIceCandidate(
              data.candidate
            )

          );

        } catch (error) {

          console.error(
            "Candidate error:",
            error
          );

        }

      }

    });

}


/* =========================================
   REMOTE AUDIO
========================================= */

function addRemoteAudio(
  peerId,
  stream
) {

  const container =
    document.getElementById(
      "audioContainer"
    );


  let audio =
    document.getElementById(
      "audio_" + peerId
    );


  if (!audio) {

    audio =
      document.createElement(
        "audio"
      );


    audio.id =
      "audio_" + peerId;


    audio.autoplay = true;


    audio.playsInline = true;


    audio.controls = false;


    container.appendChild(
      audio
    );

  }


  audio.srcObject =
    stream;


  audio.play().catch(
    function(error) {

      console.log(
        "Audio autoplay waiting:",
        error
      );

    }
  );

}


/* =========================================
   MUTE
========================================= */

async function toggleMute() {

  if (!localStream) return;


  muted = !muted;


  localStream
    .getAudioTracks()
    .forEach(function(track) {

      track.enabled =
        !muted;

    });


  try {

    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .update({

        muted: muted

      });

  } catch (error) {

    console.error(error);

  }


  updateUI();

}


/* =========================================
   LEAVE
========================================= */

async function leaveVoice() {

  if (!joined) return;


  try {

    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .delete();

  } catch (error) {

    console.error(error);

  }


  for (
    const peerId in peers
  ) {

    closePeer(peerId);

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    localStream = null;

  }


  joined = false;

  muted = false;


  document
    .getElementById(
      "audioContainer"
    )
    .innerHTML = "";


  updateUI();


  showMessage(
    "You left the voice room."
  );

}


/* =========================================
   CLOSE PEER
========================================= */

function closePeer(
  peerId
) {

  if (!peers[peerId]) return;


  try {

    peers[peerId].pc.close();

  } catch (error) {

    console.error(error);

  }


  delete peers[peerId];


  const audio =
    document.getElementById(
      "audio_" + peerId
    );


  if (audio) {

    audio.remove();

  }

}


/* =========================================
   UI
========================================= */

function updateUI() {

  const join =
    document.getElementById(
      "joinBtn"
    );

  const mute =
    document.getElementById(
      "muteBtn"
    );

  const leave =
    document.getElementById(
      "leaveBtn"
    );

  const dot =
    document.getElementById(
      "statusDot"
    );

  const status =
    document.getElementById(
      "statusText"
    );

  const mic =
    document.getElementById(
      "micIcon"
    );


  if (joined) {

    join.disabled = true;

    mute.disabled = false;

    leave.disabled = false;


    if (muted) {

      status.textContent =
        "Muted";

      dot.className =
        "muted";

      mute.textContent =
        "🎙️ UNMUTE";

      mic.textContent =
        "🔇";

    } else {

      status.textContent =
        "LIVE";

      dot.className =
        "live";

      mute.textContent =
        "🔇 MUTE";

      mic.textContent =
        "🎙️";

    }

  } else {

    join.disabled = false;

    mute.disabled = true;

    leave.disabled = true;


    status.textContent =
      "Disconnected";

    dot.className =
      "offline";

    mic.textContent =
      "🎙️";

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  message
) {

  document
    .getElementById(
      "message"
    )
    .textContent =
    message;

}


/* =========================================
   HOME
========================================= */

function goHome() {

  leaveVoice();

  window.location.href =
    "home.html";

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   START SIGNALING LISTENER
========================================= */

auth.onAuthStateChanged(
  function(user) {

    if (user) {

      setTimeout(
        function() {

          beginOfferListener();

        },
        1000
      );

    }

  }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }

  }
);

</script>
