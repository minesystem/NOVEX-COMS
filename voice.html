<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS — Voice</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08000f;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .topbar {
      padding: 18px;
      background: #12001f;
      border-bottom: 1px solid #7d20ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #b66cff;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: #12001f;
      border: 1px solid #6420a0;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(130, 30, 255, .15);
    }

    h1 {
      margin-top: 0;
      color: #c078ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #joinBtn {
      background: #8b2cff;
      color: white;
    }

    #leaveBtn {
      background: #401052;
      color: white;
      display: none;
    }

    #muteBtn {
      background: #6415a0;
      color: white;
      display: none;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #1c0928;
      margin: 15px 0;
      line-height: 1.5;
    }

    .member {
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      background: #1b0828;
    }

    .error {
      color: #ff7d9c;
      background: #280914;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
      line-height: 1.5;
    }

    .back {
      color: #c078ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">NØV3X COMS</div>
    <a class="back" href="home.html">← Dashboard</a>
  </div>

  <div class="container">

    <div class="card">
      <h1>🔊 Clan Voice</h1>

      <div id="status" class="status">
        Checking microphone support...
      </div>

      <button id="joinBtn" onclick="joinVoice()">
        🔊 JOIN VOICE
      </button>

      <button id="muteBtn" onclick="toggleMute()">
        🎤 MUTE
      </button>

      <button id="leaveBtn" onclick="leaveVoice()">
        🚪 LEAVE VOICE
      </button>

      <div id="errorBox" class="error"></div>
    </div>

    <div class="card">
      <h2>👥 In Voice</h2>
      <div id="members">
        Nobody is currently in voice.
      </div>
    </div>

  </div>

<script>

let currentUser = null;
let localStream = null;
let joined = false;
let muted = false;

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("errorBox");

function showError(message) {
  errorBox.style.display = "block";
  errorBox.innerHTML = message;
}

function clearError() {
  errorBox.style.display = "none";
  errorBox.innerHTML = "";
}

function setStatus(message) {
  statusBox.innerHTML = message;
}

function checkMicrophoneSupport() {

  if (!window.isSecureContext) {
    setStatus("❌ This page is not using a secure connection.");
    showError(
      "Microphone access requires HTTPS. Open your NØV3X COMS website using its HTTPS GitHub Pages address."
    );
    return false;
  }

  if (!navigator.mediaDevices) {
    setStatus("❌ Microphone API unavailable.");
    showError(
      "Your current browser does not allow microphone access from this page. Open the site directly in Chrome."
    );
    return false;
  }

  if (!navigator.mediaDevices.getUserMedia) {
    setStatus("❌ getUserMedia unavailable.");
    showError(
      "Your browser does not support microphone access on this page."
    );
    return false;
  }

  setStatus("✅ Microphone access is available. Press JOIN VOICE.");
  return true;
}

async function joinVoice() {

  clearError();

  if (!checkMicrophoneSupport()) {
    return;
  }

  try {

    setStatus("🎤 Requesting microphone permission...");

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });

    joined = true;

    document.getElementById("joinBtn").style.display = "none";
    document.getElementById("muteBtn").style.display = "block";
    document.getElementById("leaveBtn").style.display = "block";

    setStatus("🟢 Microphone connected. You are in Clan Voice.");

    await db.collection("voiceRoom")
      .doc(currentUser.uid)
      .set({
        uid: currentUser.uid,
        username: currentUser.username,
        muted: false,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

  } catch (error) {

    console.error(error);

    let message = "";

    if (error.name === "NotAllowedError") {
      message =
        "🎤 <b>Microphone permission was blocked.</b><br><br>" +
        "Open your browser's site permissions and set Microphone to Allow, then reload this page.";
    }

    else if (error.name === "SecurityError") {
      message =
        "🔒 <b>Security restriction.</b><br><br>" +
        "Open the site using HTTPS and not an HTTP address.";
    }

    else if (error.name === "NotFoundError") {
      message =
        "🎤 <b>No microphone was found.</b><br><br>" +
        "Check that your device has a microphone available.";
    }

    else if (error.name === "NotReadableError") {
      message =
        "🎤 <b>The microphone is already being used.</b><br><br>" +
        "Close another app or browser tab using the microphone and try again.";
    }

    else {
      message =
        "❌ <b>Microphone error:</b><br>" +
        error.name + "<br><br>" +
        error.message;
    }

    setStatus("❌ Microphone access failed.");
    showError(message);
  }
}

async function toggleMute() {

  if (!localStream) return;

  muted = !muted;

  localStream.getAudioTracks().forEach(track => {
    track.enabled = !muted;
  });

  document.getElementById("muteBtn").innerHTML =
    muted ? "🔇 UNMUTE" : "🎤 MUTE";

  await db.collection("voiceRoom")
    .doc(currentUser.uid)
    .update({
      muted: muted
    });

  setStatus(
    muted
      ? "🔇 You are muted."
      : "🎤 Your microphone is active."
  );
}

async function leaveVoice() {

  joined = false;

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  if (currentUser) {
    await db.collection("voiceRoom")
      .doc(currentUser.uid)
      .delete()
      .catch(() => {});
  }

  document.getElementById("joinBtn").style.display = "block";
  document.getElementById("muteBtn").style.display = "none";
  document.getElementById("leaveBtn").style.display = "none";

  setStatus("You left Clan Voice.");
}

db.collection("voiceRoom").onSnapshot(snapshot => {

  const members = document.getElementById("members");

  if (snapshot.empty) {
    members.innerHTML = "Nobody is currently in voice.";
    return;
  }

  members.innerHTML = "";

  snapshot.forEach(doc => {

    const data = doc.data();

    const div = document.createElement("div");
    div.className = "member";

    div.innerHTML =
      (data.muted ? "🔇 " : "🎤 ") +
      escapeHTML(data.username || "Member");

    members.appendChild(div);
  });
});

function escapeHTML(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

firebase.auth().onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  try {

    const doc = await db
      .collection("users")
      .doc(user.uid)
      .get();

    if (!doc.exists || doc.data().approved !== true) {
      window.location.href = "pending.html";
      return;
    }

    currentUser.username =
      doc.data().username || "Member";

    checkMicrophoneSupport();

  } catch (error) {

    console.error(error);

    setStatus("❌ Unable to verify your clan account.");
  }
});

window.addEventListener("beforeunload", () => {

  if (currentUser && joined) {

    db.collection("voiceRoom")
      .doc(currentUser.uid)
      .delete()
      .catch(() => {});
  }

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }
});

</script>

</body>
</html>
