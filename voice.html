<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØV3X COMS — Clan Voice</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090014;
  color: white;
}

header {
  padding: 18px;
  background: #140021;
  border-bottom: 1px solid #7b2cff;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #b96cff;
}

.back {
  display: inline-block;
  margin-top: 8px;
  color: #aaa;
  text-decoration: none;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.voice-box {
  background: #12001e;
  border: 1px solid #6522a8;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(130, 40, 255, .15);
}

h1 {
  margin-top: 0;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #1b0730;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.join {
  background: #8b2cff;
  color: white;
}

.mute {
  background: #29202f;
  color: white;
}

.leave {
  background: #b32626;
  color: white;
}

button:disabled {
  opacity: .5;
}

.members {
  margin-top: 20px;
}

.member {
  padding: 13px;
  margin-top: 8px;
  background: #1b0829;
  border-radius: 10px;
  border: 1px solid #352044;
}

.audio-container audio {
  display: none;
}
</style>
</head>

<body>

<header>
  <div class="logo">NØV3X COMS</div>
  <a class="back" href="home.html">← Dashboard</a>
</header>

<div class="container">

  <div class="voice-box">

    <h1>🔊 Clan Voice</h1>

    <div id="status" class="status">
      🔴 Not connected
    </div>

    <button id="joinBtn" class="join">
      🔊 JOIN VOICE
    </button>

    <button id="muteBtn" class="mute" disabled>
      🎤 MUTE
    </button>

    <button id="leaveBtn" class="leave" disabled>
      🚪 LEAVE VOICE
    </button>

    <div class="members">
      <h3>👥 In Voice</h3>
      <div id="memberList">
        Nobody is currently in voice.
      </div>
    </div>

    <div id="audioContainer" class="audio-container"></div>

  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

const statusBox = document.getElementById("status");
const joinBtn = document.getElementById("joinBtn");
const muteBtn = document.getElementById("muteBtn");
const leaveBtn = document.getElementById("leaveBtn");
const memberList = document.getElementById("memberList");
const audioContainer = document.getElementById("audioContainer");

let currentUser = null;
let username = "";

let localStream = null;
let joined = false;
let muted = false;

let sessionId = crypto.randomUUID();

const peers = {};
const pendingCandidates = {};
const seenSignals = new Set();

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "stun:stun1.l.google.com:19302"
    }
  ]
};


/* =========================
   AUTH CHECK
========================= */

auth.onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  const doc = await db
    .collection("users")
    .doc(user.uid)
    .get();

  if (!doc.exists || doc.data().approved !== true) {
    await auth.signOut();
    window.location.href = "index.html";
    return;
  }

  username = doc.data().username || "Member";

});


/* =========================
   JOIN VOICE
========================= */

joinBtn.onclick = async () => {

  if (joined) return;

  try {

    statusBox.innerHTML = "🎤 Requesting microphone...";

    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });

    joined = true;

    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .set({
        uid: currentUser.uid,
        username: username,
        sessionId: sessionId,
        muted: false,
        joinedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

    joinBtn.disabled = true;
    muteBtn.disabled = false;
    leaveBtn.disabled = false;

    statusBox.innerHTML =
      "🟢 Connected to NØV3X Clan Voice";

    listenForMembers();
    listenForSignals();

  } catch (error) {

    console.error(error);

    statusBox.innerHTML =
      "❌ Microphone connection failed: " +
      error.message;
  }
};


/* =========================
   MEMBER LIST
========================= */

function listenForMembers() {

  db.collection("voiceRoom")
    .onSnapshot(snapshot => {

      const members = [];

      snapshot.forEach(doc => {
        const data = doc.data();

        if (data.uid !== currentUser.uid) {
          members.push(data);
        }
      });

      if (members.length === 0) {

        memberList.innerHTML =
          "Nobody else is currently in voice.";

      } else {

        memberList.innerHTML = members.map(member => {

          return `
            <div class="member">
              🎤 ${escapeHtml(member.username)}
            </div>
          `;

        }).join("");

      }

      /*
       Create connections with every other
       member currently inside the room.
      */

      members.forEach(member => {

        if (!peers[member.uid]) {

          const shouldCall =
            currentUser.uid < member.uid;

          if (shouldCall) {
            createOffer(member);
          }
        }

      });

    });

}


/* =========================
   CREATE PEER
========================= */

function createPeer(member) {

  if (peers[member.uid]) {
    return peers[member.uid];
  }

  const pc = new RTCPeerConnection(rtcConfig);

  peers[member.uid] = pc;

  pendingCandidates[member.uid] =
    pendingCandidates[member.uid] || [];


  /* Local audio */

  if (localStream) {

    localStream.getTracks().forEach(track => {

      pc.addTrack(track, localStream);

    });

  }


  /* Remote audio */

  pc.ontrack = event => {

    let audio =
      document.getElementById("audio-" + member.uid);

    if (!audio) {

      audio = document.createElement("audio");

      audio.id = "audio-" + member.uid;

      audio.autoplay = true;
      audio.playsInline = true;

      audioContainer.appendChild(audio);
    }

    audio.srcObject = event.streams[0];

    audio.play().catch(() => {});
  };


  /* ICE candidates */

  pc.onicecandidate = async event => {

    if (!event.candidate) return;

    await db.collection("voiceSignals").add({

      roomId: "main",

      from: currentUser.uid,
      to: member.uid,

      type: "candidate",

      candidate: event.candidate.toJSON(),

      sessionId: sessionId,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  };


  pc.onconnectionstatechange = () => {

    console.log(
      "Voice connection:",
      member.username,
      pc.connectionState
    );

  };


  return pc;
}


/* =========================
   CREATE OFFER
========================= */

async function createOffer(member) {

  try {

    const pc = createPeer(member);

    if (pc.signalingState !== "stable") {
      return;
    }

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    await db.collection("voiceSignals").add({

      roomId: "main",

      from: currentUser.uid,
      to: member.uid,

      type: "offer",

      sdp: {
        type: offer.type,
        sdp: offer.sdp
      },

      sessionId: sessionId,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================
   SIGNAL LISTENER
========================= */

function listenForSignals() {

  db.collection("voiceSignals")
    .where("to", "==", currentUser.uid)
    .onSnapshot(async snapshot => {

      for (const change of snapshot.docChanges()) {

        if (change.type !== "added") {
          continue;
        }

        const signalId = change.doc.id;

        if (seenSignals.has(signalId)) {
          continue;
        }

        seenSignals.add(signalId);

        const signal = change.doc.data();

        if (signal.roomId !== "main") {
          continue;
        }

        await handleSignal(signal);
      }

    });

}


/* =========================
   HANDLE SIGNAL
========================= */

async function handleSignal(signal) {

  if (!joined) return;

  const sender = signal.from;

  /*
   Ignore our own old session signals.
  */

  if (!sender || sender === currentUser.uid) {
    return;
  }

  try {

    let memberData = {
      uid: sender,
      username: "NØV3X Member"
    };

    const memberDoc =
      await db.collection("voiceRoom")
        .doc(sender)
        .get();

    if (memberDoc.exists) {
      memberData = memberDoc.data();
    }

    const pc = createPeer(memberData);


    /* OFFER */

    if (signal.type === "offer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(signal.sdp)
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(answer);

      await db.collection("voiceSignals").add({

        roomId: "main",

        from: currentUser.uid,
        to: sender,

        type: "answer",

        sdp: {
          type: answer.type,
          sdp: answer.sdp
        },

        sessionId: sessionId,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

      await flushCandidates(sender);

    }


    /* ANSWER */

    else if (signal.type === "answer") {

      await pc.setRemoteDescription(
        new RTCSessionDescription(signal.sdp)
      );

      await flushCandidates(sender);

    }


    /* ICE CANDIDATE */

    else if (signal.type === "candidate") {

      const candidate =
        new RTCIceCandidate(signal.candidate);

      if (pc.remoteDescription) {

        await pc.addIceCandidate(candidate);

      } else {

        pendingCandidates[sender].push(candidate);

      }

    }

  } catch (error) {

    console.error(
      "Signal error:",
      error
    );

  }

}


/* =========================
   FLUSH ICE
========================= */

async function flushCandidates(uid) {

  const pc = peers[uid];

  if (!pc) return;

  const queue =
    pendingCandidates[uid] || [];

  while (queue.length) {

    const candidate =
      queue.shift();

    try {

      await pc.addIceCandidate(candidate);

    } catch (error) {

      console.error(
        "ICE error:",
        error
      );

    }

  }

}


/* =========================
   MUTE
========================= */

muteBtn.onclick = async () => {

  if (!localStream) return;

  muted = !muted;

  localStream
    .getAudioTracks()
    .forEach(track => {
      track.enabled = !muted;
    });

  muteBtn.innerHTML =
    muted ? "🔇 UNMUTE" : "🎤 MUTE";

  await db.collection("voiceRoom")
    .doc(currentUser.uid)
    .update({
      muted: muted
    });

};


/* =========================
   LEAVE
========================= */

leaveBtn.onclick = async () => {

  await leaveVoice();

};


async function leaveVoice() {

  joined = false;

  if (localStream) {

    localStream.getTracks().forEach(track => {
      track.stop();
    });

    localStream = null;
  }


  Object.values(peers).forEach(pc => {

    try {
      pc.close();
    } catch (e) {}

  });


  Object.keys(peers).forEach(uid => {

    delete peers[uid];

    const audio =
      document.getElementById("audio-" + uid);

    if (audio) {
      audio.remove();
    }

  });


  if (currentUser) {

    try {

      await db.collection("voiceRoom")
        .doc(currentUser.uid)
        .delete();

    } catch (error) {

      console.error(error);

    }

  }


  joinBtn.disabled = false;
  muteBtn.disabled = true;
  leaveBtn.disabled = true;

  muteBtn.innerHTML = "🎤 MUTE";

  statusBox.innerHTML =
    "🔴 You left Clan Voice";

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (localStream) {

      localStream.getTracks().forEach(track => {
        track.stop();
      });

    }

  }
);


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
