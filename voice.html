<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NØV3X COMS — Clan Voice</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090014;
  color: white;
}

header {
  padding: 18px;
  background: #140021;
  border-bottom: 1px solid #7627c9;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #b96cff;
}

.back {
  display: inline-block;
  margin-top: 8px;
  color: #aaa;
  text-decoration: none;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.voice-box {
  background: #12001e;
  border: 1px solid #6522a8;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(130,40,255,.15);
}

h1 {
  margin-top: 0;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #1b0730;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.join {
  background: #8b2cff;
  color: white;
}

.audio {
  background: #54208c;
  color: white;
}

.mute {
  background: #29202f;
  color: white;
}

.leave {
  background: #b32626;
  color: white;
}

button:disabled {
  opacity: .45;
}

.member {
  padding: 13px;
  margin-top: 8px;
  background: #1b0829;
  border-radius: 10px;
  border: 1px solid #352044;
}

.connected {
  color: #66ff99;
}

.audio-holder audio {
  width: 100%;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">NØV3X COMS</div>
  <a class="back" href="home.html">← Dashboard</a>
</header>

<div class="container">

<div class="voice-box">

<h1>🔊 Clan Voice</h1>

<div id="status" class="status">
🔴 Not connected
</div>

<button id="joinBtn" class="join">
🔊 JOIN VOICE
</button>

<button id="audioBtn" class="audio" disabled>
🔊 ENABLE AUDIO
</button>

<button id="muteBtn" class="mute" disabled>
🎤 MUTE
</button>

<button id="leaveBtn" class="leave" disabled>
🚪 LEAVE VOICE
</button>

<h3>👥 In Voice</h3>

<div id="memberList">
Nobody is currently in voice.
</div>

<div id="audioHolder" class="audio-holder"></div>

</div>
</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

const statusBox = document.getElementById("status");
const joinBtn = document.getElementById("joinBtn");
const audioBtn = document.getElementById("audioBtn");
const muteBtn = document.getElementById("muteBtn");
const leaveBtn = document.getElementById("leaveBtn");
const memberList = document.getElementById("memberList");
const audioHolder = document.getElementById("audioHolder");

let currentUser = null;
let username = "";

let localStream = null;
let joined = false;
let muted = false;

const sessionId =
  crypto.randomUUID();

const peers = {};
const memberData = {};
const candidateQueues = {};
const seenSignals = new Set();

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  currentUser = user;

  try {

    const userDoc = await db
      .collection("users")
      .doc(user.uid)
      .get();

    if (!userDoc.exists ||
        userDoc.data().approved !== true) {

      await auth.signOut();
      window.location.href = "index.html";
      return;
    }

    username =
      userDoc.data().username || "Member";

  } catch (error) {

    console.error(error);

    statusBox.innerHTML =
      "❌ Failed to load account.";

  }

});


/* =========================
   JOIN
========================= */

joinBtn.onclick = async () => {

  if (joined) return;

  try {

    statusBox.innerHTML =
      "🎤 Requesting microphone...";

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },

        video: false

      });


    joined = true;


    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .set({

        uid: currentUser.uid,

        username: username,

        sessionId: sessionId,

        muted: false,

        joinedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    joinBtn.disabled = true;
    audioBtn.disabled = false;
    muteBtn.disabled = false;
    leaveBtn.disabled = false;


    statusBox.innerHTML =
      "🟢 You are connected to Clan Voice";

    statusBox.classList.add("connected");


    startMemberListener();
    startSignalListener();


  } catch (error) {

    console.error(error);

    statusBox.innerHTML =
      "❌ Microphone failed: " +
      error.message;

  }

};


/* =========================
   MEMBER LISTENER
========================= */

function startMemberListener() {

  db.collection("voiceRoom")
    .onSnapshot(async snapshot => {

      const activeMembers = {};

      snapshot.forEach(doc => {

        const data = doc.data();

        if (data.uid === currentUser.uid) {
          return;
        }

        activeMembers[data.uid] = data;

      });


      /* Save member information */

      Object.keys(activeMembers).forEach(uid => {

        memberData[uid] =
          activeMembers[uid];

      });


      /* Display members */

      const ids =
        Object.keys(activeMembers);


      if (ids.length === 0) {

        memberList.innerHTML =
          "Nobody else is currently in voice.";

      } else {

        memberList.innerHTML =
          ids.map(uid => {

            const member =
              activeMembers[uid];

            return `
              <div class="member">
                🎤 ${escapeHtml(member.username)}
                ${member.muted ? " 🔇" : ""}
              </div>
            `;

          }).join("");

      }


      /* Create/remove connections */

      ids.forEach(uid => {

        const member =
          activeMembers[uid];

        if (!peers[uid]) {

          /*
            Lower UID is the caller.
            Higher UID waits for the offer.
          */

          if (currentUser.uid < uid) {

            createOffer(member);

          }

        }

      });


      /* Close peers for members who left */

      Object.keys(peers).forEach(uid => {

        if (!activeMembers[uid]) {

          closePeer(uid);

        }

      });

    });

}


/* =========================
   CREATE PEER
========================= */

function createPeer(member) {

  if (peers[member.uid]) {
    return peers[member.uid];
  }


  const pc =
    new RTCPeerConnection(rtcConfig);


  peers[member.uid] = pc;

  candidateQueues[member.uid] =
    candidateQueues[member.uid] || [];


  /* Add microphone */

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  /* Remote audio */

  pc.ontrack = event => {

    console.log(
      "🔊 Remote audio received from",
      member.username
    );


    let audio =
      document.getElementById(
        "audio-" + member.uid
      );


    if (!audio) {

      audio =
        document.createElement("audio");

      audio.id =
        "audio-" + member.uid;

      audio.autoplay = true;
      audio.playsInline = true;

      audio.setAttribute(
        "controls",
        "false"
      );

      audioHolder.appendChild(audio);

    }


    audio.srcObject =
      event.streams[0];


    audio.play()
      .then(() => {

        console.log(
          "🔊 Audio playing:",
          member.username
        );

      })
      .catch(error => {

        console.log(
          "Audio autoplay blocked:",
          error
        );

      });

  };


  /* ICE */

  pc.onicecandidate = async event => {

    if (!event.candidate) {
      return;
    }


    try {

      await db
        .collection("voiceSignals")
        .add({

          roomId: "main",

          from: currentUser.uid,

          to: member.uid,

          toSessionId:
            member.sessionId,

          type: "candidate",

          candidate:
            event.candidate.toJSON(),

          sessionId:
            sessionId,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });

    } catch (error) {

      console.error(
        "ICE send error:",
        error
      );

    }

  };


  pc.onconnectionstatechange = () => {

    console.log(
      "Connection",
      member.username,
      pc.connectionState
    );


    if (
      pc.connectionState ===
      "connected"
    ) {

      statusBox.innerHTML =
        "🟢 Live voice connected";

    }


    if (
      pc.connectionState ===
      "failed"
    ) {

      console.log(
        "Connection failed with",
        member.username
      );

    }

  };


  return pc;

}


/* =========================
   OFFER
========================= */

async function createOffer(member) {

  try {

    const pc =
      createPeer(member);


    if (
      pc.signalingState !==
      "stable"
    ) {
      return;
    }


    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    await db
      .collection("voiceSignals")
      .add({

        roomId: "main",

        from: currentUser.uid,

        to: member.uid,

        toSessionId:
          member.sessionId,

        type: "offer",

        sdp: {

          type: offer.type,

          sdp: offer.sdp

        },

        sessionId:
          sessionId,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });


    console.log(
      "📡 Offer sent to",
      member.username
    );

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================
   SIGNAL LISTENER
========================= */

function startSignalListener() {

  db.collection("voiceSignals")
    .where(
      "to",
      "==",
      currentUser.uid
    )
    .onSnapshot(async snapshot => {

      for (
        const change of snapshot.docChanges()
      ) {

        if (change.type !== "added") {
          continue;
        }


        const signalId =
          change.doc.id;


        if (
          seenSignals.has(signalId)
        ) {
          continue;
        }


        seenSignals.add(signalId);


        const signal =
          change.doc.data();


        if (
          signal.roomId !== "main"
        ) {
          continue;
        }


        /*
          Only accept signals meant
          for this exact login session.
        */

        if (
          signal.toSessionId &&
          signal.toSessionId !== sessionId
        ) {
          continue;
        }


        /*
          Ignore our own signals.
        */

        if (
          signal.from ===
          currentUser.uid
        ) {
          continue;
        }


        await handleSignal(signal);

      }

    });

}


/* =========================
   HANDLE SIGNAL
========================= */

async function handleSignal(signal) {

  const sender =
    signal.from;


  try {

    let member =
      memberData[sender];


    if (!member) {

      const doc =
        await db
          .collection("voiceRoom")
          .doc(sender)
          .get();


      if (!doc.exists) {
        return;
      }


      member =
        doc.data();

      memberData[sender] =
        member;

    }


    const pc =
      createPeer(member);


    /* OFFER */

    if (
      signal.type ===
      "offer"
    ) {

      console.log(
        "📡 Offer received"
      );


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          signal.sdp
        )
      );


      await flushCandidates(
        sender
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      await db
        .collection("voiceSignals")
        .add({

          roomId: "main",

          from:
            currentUser.uid,

          to:
            sender,

          toSessionId:
            member.sessionId,

          type:
            "answer",

          sdp: {

            type:
              answer.type,

            sdp:
              answer.sdp

          },

          sessionId:
            sessionId,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


      console.log(
        "📡 Answer sent"
      );

    }


    /* ANSWER */

    else if (
      signal.type ===
      "answer"
    ) {

      console.log(
        "📡 Answer received"
      );


      if (
        pc.signalingState ===
        "have-local-offer"
      ) {

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            signal.sdp
          )
        );


        await flushCandidates(
          sender
        );

      }

    }


    /* ICE */

    else if (
      signal.type ===
      "candidate"
    ) {

      const candidate =
        new RTCIceCandidate(
          signal.candidate
        );


      if (
        pc.remoteDescription
      ) {

        await pc.addIceCandidate(
          candidate
        );

      } else {

        candidateQueues[sender]
          .push(candidate);

      }

    }

  } catch (error) {

    console.error(
      "Signal handling error:",
      error
    );

  }

}


/* =========================
   ICE QUEUE
========================= */

async function flushCandidates(uid) {

  const pc =
    peers[uid];


  if (!pc) {
    return;
  }


  const queue =
    candidateQueues[uid] || [];


  while (
    queue.length > 0
  ) {

    const candidate =
      queue.shift();


    try {

      await pc.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.error(
        "ICE candidate error:",
        error
      );

    }

  }

}


/* =========================
   ENABLE AUDIO
========================= */

audioBtn.onclick = async () => {

  const audios =
    audioHolder.querySelectorAll(
      "audio"
    );


  for (
    const audio of audios
  ) {

    try {

      await audio.play();

    } catch (error) {

      console.log(
        "Could not play audio",
        error
      );

    }

  }


  statusBox.innerHTML =
    "🔊 Remote audio enabled";

};


/* =========================
   MUTE
========================= */

muteBtn.onclick = async () => {

  if (!localStream) {
    return;
  }


  muted =
    !muted;


  localStream
    .getAudioTracks()
    .forEach(track => {

      track.enabled =
        !muted;

    });


  muteBtn.innerHTML =
    muted
      ? "🔇 UNMUTE"
      : "🎤 MUTE";


  try {

    await db
      .collection("voiceRoom")
      .doc(currentUser.uid)
      .update({

        muted:
          muted

      });

  } catch (error) {

    console.error(error);

  }

};


/* =========================
   CLOSE PEER
========================= */

function closePeer(uid) {

  const pc =
    peers[uid];


  if (pc) {

    try {
      pc.close();
    } catch (e) {}

  }


  delete peers[uid];
  delete candidateQueues[uid];
  delete memberData[uid];


  const audio =
    document.getElementById(
      "audio-" + uid
    );


  if (audio) {
    audio.remove();
  }

}


/* =========================
   LEAVE
========================= */

leaveBtn.onclick =
  async () => {

    await leaveVoice();

  };


async function leaveVoice() {

  joined = false;


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    localStream = null;

  }


  Object.keys(peers)
    .forEach(uid => {

      closePeer(uid);

    });


  if (currentUser) {

    try {

      await db
        .collection("voiceRoom")
        .doc(currentUser.uid)
        .delete();

    } catch (error) {

      console.error(error);

    }

  }


  joinBtn.disabled = false;
  audioBtn.disabled = true;
  muteBtn.disabled = true;
  leaveBtn.disabled = true;


  muteBtn.innerHTML =
    "🎤 MUTE";


  statusBox.classList.remove(
    "connected"
  );


  statusBox.innerHTML =
    "🔴 You left Clan Voice";

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

    }

  }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
