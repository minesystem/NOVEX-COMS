<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X COMS - Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08030f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      background: #12051f;
      border-bottom: 1px solid #7b2cff;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;
    }

    .logo {
      color: #b76cff;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      background: #24103b;
      border: 1px solid #7b2cff;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .chat-title {
      padding: 18px;
      border-bottom: 1px solid #29133d;
    }

    .chat-title h2 {
      color: #c88aff;
    }

    .chat-title p {
      color: #777;
      margin-top: 5px;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      background: #12091d;
      border: 1px solid #29133d;
      border-radius: 9px;
      padding: 10px 13px;
      margin-bottom: 10px;
    }

    .name {
      color: #b76cff;
      font-weight: bold;
    }

    .message-text {
      margin-top: 5px;
      color: #eee;
      word-break: break-word;
    }

    .time {
      margin-top: 5px;
      color: #666;
      font-size: 10px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 15px;
      background: #0e0618;
      border-top: 1px solid #29133d;
    }

    #messageInput {
      flex: 1;
      background: #160b22;
      border: 1px solid #38204d;
      color: white;
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #7b2cff;
    }

    #sendButton {
      background: #7b2cff;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #9850ff;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    NØV3X COMS
  </div>

  <button class="back" onclick="goHome()">
    ← Dashboard
  </button>

</header>


<div class="chat-container">

  <div class="chat-title">

    <h2>💬 Community Chat</h2>

    <p>
      NOV3X member communication
    </p>

  </div>


  <div id="messages">

    <p style="color:#777;">
      Connecting to chat...
    </p>

  </div>


  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      maxlength="500"
      placeholder="Type a message..."
      autocomplete="off"
    >

    <button id="sendButton">
      SEND
    </button>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

let currentUser = null;
let currentUsername = "User";


auth.onAuthStateChanged(async function(user) {

  if (!user) {

    window.location.href = "index.html";

    return;

  }

  currentUser = user;


  try {

    const userDoc = await db
      .collection("users")
      .doc(user.uid)
      .get();


    if (userDoc.exists) {

      currentUsername =
        userDoc.data().username || "User";

    }


    loadMessages();

  } catch (error) {

    console.error(error);

    document.getElementById("messages").innerHTML =
      "<p style='color:#ff5555;'>Could not load your account.</p>";

  }

});


function loadMessages() {

  db.collection("messages")
    .orderBy("createdAt", "asc")
    .limitToLast(100)
    .onSnapshot(

      function(snapshot) {

        const messages =
          document.getElementById("messages");

        messages.innerHTML = "";


        snapshot.forEach(function(doc) {

          const data = doc.data();


          const box =
            document.createElement("div");

          box.className = "message";


          const name =
            document.createElement("div");

          name.className = "name";

          name.textContent =
            data.username || "User";


          const text =
            document.createElement("div");

          text.className = "message-text";

          text.textContent =
            data.text || "";


          const time =
            document.createElement("div");

          time.className = "time";


          if (data.createdAt) {

            time.textContent =
              data.createdAt
                .toDate()
                .toLocaleString();

          }


          box.appendChild(name);
          box.appendChild(text);
          box.appendChild(time);

          messages.appendChild(box);

        });


        messages.scrollTop =
          messages.scrollHeight;

      },

      function(error) {

        console.error(error);

        document.getElementById("messages").innerHTML =
          "<p style='color:#ff5555;'>Chat connection error.</p>";

      }

    );

}


async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if (!text || !currentUser) {

    return;

  }


  input.disabled = true;


  try {

    await db.collection("messages").add({

      uid: currentUser.uid,

      username: currentUsername,

      text: text,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


    input.value = "";

  } catch (error) {

    console.error(error);

    alert("Message could not be sent.");

  }


  input.disabled = false;

  input.focus();

}


document
  .getElementById("sendButton")
  .addEventListener("click", sendMessage);


document
  .getElementById("messageInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

      sendMessage();

    }

  });


function goHome() {

  window.location.href = "home.html";

}

</script>

</body>
</html>
