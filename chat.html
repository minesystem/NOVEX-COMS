<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NØV3X COMS - Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #08030f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 65px;
      background: #12051f;
      border-bottom: 1px solid #7b2cff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .logo {
      color: #b76cff;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      background: #24103b;
      color: white;
      border: 1px solid #7b2cff;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: auto;
      overflow: hidden;
    }

    .chat-header {
      padding: 18px;
      border-bottom: 1px solid #29133d;
    }

    .chat-header h2 {
      color: #c88aff;
    }

    .chat-header p {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      background: #12091d;
      border: 1px solid #29133d;
      border-radius: 9px;
      padding: 10px 13px;
      margin-bottom: 10px;
    }

    .username {
      color: #b76cff;
      font-weight: bold;
      font-size: 14px;
    }

    .text {
      color: #eee;
      margin-top: 5px;
      word-wrap: break-word;
    }

    .time {
      color: #666;
      font-size: 10px;
      margin-top: 5px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 15px;
      border-top: 1px solid #29133d;
      background: #0e0618;
    }

    #messageInput {
      flex: 1;
      background: #160b22;
      border: 1px solid #38204d;
      color: white;
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    #messageInput:focus {
      border-color: #7b2cff;
    }

    #sendButton {
      background: #7b2cff;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #9850ff;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="logo">NØV3X COMS</div>

    <button class="back" onclick="goHome()">
      ← Dashboard
    </button>
  </header>

  <main class="chat">

    <div class="chat-header">
      <h2>💬 Community Chat</h2>
      <p>Talk with NOV3X members</p>
    </div>

    <div id="messages">
      <p style="color:#777;">Loading messages...</p>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        maxlength="500"
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        SEND
      </button>
    </div>

  </main>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>

  <script>

    let currentUser = null;
    let username = "User";

    auth.onAuthStateChanged(async (user) => {

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      currentUser = user;

      try {

        const userDoc = await db
          .collection("users")
          .doc(user.uid)
          .get();

        if (userDoc.exists) {
          username = userDoc.data().username || "User";
        }

        loadMessages();

      } catch (error) {

        console.error(error);

      }

    });


    function loadMessages() {

      db.collection("messages")
        .orderBy("createdAt", "asc")
        .limitToLast(100)
        .onSnapshot((snapshot) => {

          const messages = document.getElementById("messages");

          messages.innerHTML = "";

          snapshot.forEach((doc) => {

            const data = doc.data();

            const message = document.createElement("div");
            message.className = "message";

            const name = document.createElement("div");
            name.className = "username";
            name.textContent = data.username || "User";

            const text = document.createElement("div");
            text.className = "text";
            text.textContent = data.text || "";

            const time = document.createElement("div");
            time.className = "time";

            if (data.createdAt) {
              time.textContent =
                data.createdAt.toDate().toLocaleString();
            }

            message.appendChild(name);
            message.appendChild(text);
            message.appendChild(time);

            messages.appendChild(message);

          });

          messages.scrollTop = messages.scrollHeight;

        }, (error) => {

          console.error("Chat error:", error);

          document.getElementById("messages").innerHTML =
            "<p style='color:#ff6666;'>Unable to load messages.</p>";

        });

    }


    async function sendMessage() {

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !currentUser) {
        return;
      }

      input.disabled = true;

      try {

        await db.collection("messages").add({

          uid: currentUser.uid,
          username: username,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()

        });

        input.value = "";

      } catch (error) {

        console.error("Send error:", error);

        alert("Could not send message.");

      }

      input.disabled = false;
      input.focus();

    }


    document.getElementById("messageInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      });


    function goHome() {
      window.location.href = "home.html";
    }

  </script>

</body>
</html>
